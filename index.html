function setTimer(action){if(!S.active)return;let a=S.active,e=EX[selectedExercise()],p=a.prescriptions?.[workoutIndex]||e;tickRest();if(action==='reset'){a.restRemain=p.rest;a.restEnd=Date.now()+a.restRemain*1000;a.paused=false}if(action==='pause'){a.paused=true;a.restEnd=0}if(action==='resume'){a.paused=false;a.restEnd=Date.now()+a.restRemain*1000}if(action==='skip'){a.restRemain=0;a.restEnd=0;a.paused=true}persist();render()}
function setEffort(v){effort=v;document.querySelectorAll('[data-effort]').forEach(b=>b.classList.toggle('on',b.dataset.effort===v))}
function logSet(){if(!S.active)return;if(v16Mode()==='blocked'){showToast(v16t('noStart'));return}let id=selectedExercise(),e=EX[id],p=S.active.prescriptions?.[workoutIndex]||e;if(countFor(workoutIndex)>=p.sets){showToast(t('alreadyDone'));return}
 let weight=Number(document.getElementById('weightInput')?.value),reps=Number(document.getElementById('repsInput')?.value);
 if(!Number.isFinite(weight)||weight<0||weight>1000||!Number.isInteger(reps)||reps<1||reps>100){showToast(t('errorReps'));return}
 S.active.sets.push({id,index:workoutIndex,kg:weight,reps,effort,at:new Date().toISOString()});S.active.restRemain=p.rest;S.active.restEnd=Date.now()+p.rest*1000;S.active.paused=false;persist();render();}
function moveExercise(delta){workoutIndex=Math.max(0,Math.min(currentPlan().length-1,workoutIndex+delta));if(S.active)S.active.currentIndex=workoutIndex;effort='okay';persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function swapExercise(){let id=selectedExercise(),e=EX[id];if(!e?.alts.length)return;let index=workoutIndex;let next=e.alts.find(id2=>!!EX[id2]&&id2!==id&&(S.active.smart?validChoice(id2,S.smart.assessment):true));if(!next){showToast(t('smartNoExercises'));return}S.active.exercises[index]=next;if(S.active.prescriptions){let p=S.active.prescriptions[index];S.active.prescriptions[index]={...trainingItem(next,S.smart.assessment.level,S.smart.assessment.goal,S.smart.assessment.minutes),sets:p.sets,reps:p.reps};}persist();render();showToast(t('swapDone'))}
function finishWorkout(){if(!S.active)return;if(!S.active.sets.length){showToast(t('noSets'));return}let n=S.active.sets.length;if(n<sessionTotal()&&!confirm(t('finishEarly')))return;lastSummary={type:S.active.type,smart:!!S.active.smart,planId:S.active.planId||null,started:S.active.started,finished:new Date().toISOString(),sets:[...S.active.sets],prescriptions:S.active.prescriptions?.map(x=>({...x}))||null,pain:!!S.active.pain,recoveryMode:S.active.recoveryMode||'unassessed'};S.logs.unshift(lastSummary);S.active=null;persist();go('complete');}
function saveProfile(){let name=document.getElementById('prefName')?.value||'',goal=document.getElementById('prefGoal')?.value||'strength',level=document.getElementById('prefLevel')?.value||'beginner',days=Number(document.getElementById('prefDays')?.value||4),minutes=Number(document.getElementById('prefMinutes')?.value||45),first=!S.setup;S.prefs={...S.prefs,name:name.slice(0,35),goal,level,days,minutes};S.setup=true;persist();if(first){plannerMode='assessment';go('planner')}else{go('profile')}showToast(t('saveSuccess'))}
function resetAll(){if(!confirm(t('resetConfirm')))return;if(cloudAuth){S=blankCloudState();markCloudDirty();plannerMode='assessment';page='home';render();return}safeDel(KEY);safeDel('herSetup');safeDel('herPrefs');safeDel('herLogs');S={setup:false,lang:S.lang,prefs:{...normPrefs},logs:[],active:null,smart:null,recovery:{checkins:[]}};plannerMode='assessment';page='home';persist();render()}
function selectTab(v){tab=v;render()}
function selectFilter(f){filter=f;render()}
function searchLibrary(v){query=v;const target=document.getElementById('libraryResults');if(target)target.innerHTML=libraryResults()}
function libraryResults(){let q=query.toLocaleLowerCase().trim();let list=exerciseData.map(d=>EX[d[0]]).filter(e=>(filter==='all'||e.group===filter)&&(!q||`${e.en} ${e.ar} ${e.equipment.ar} ${e.equipment.en} ${e.muscle.en} ${e.muscle.ar}`.toLocaleLowerCase().includes(q)));
 if(!list.length)return `<div class="empty-state">${t('noResults')}</div>`;
 return `<div class="exercise-list">${list.map(e=>`<div class="exercise-item"><div class="exercise-thumb">${art(e.id)}</div><div class="info"><h3>${exerciseName(e.id)}</h3><p>${esc(e.muscle[S.lang])} · ${esc(e.equipment[S.lang])}</p><div class="meta"><span>${e.sets} ${t('set')}</span><span>${e.reps} ${t('reps')}</span></div></div><button onclick="openGuide('${e.id}','library')">${t('details')}</button></div>`).join('')}</div>`}
function selectWeekDays(){return S.lang==='ar'?['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد']:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']}

const EQUIP={
 machines:['legpress','legcurl','hipabduction','chestpress','latpull','seatedrow','tricep','treadmill','bike','elliptical'],
 dumbbells:['goblet','dumbbellpress','shoulderpress','lateralraise','bicepcurl'],
 bands:['sidewalk','bandpull'],
 bodyweight:['squat','glutebridge','calfraise','stepup','wallpush','plank','deadbug','bird','jumping','stretch']
};
const dayLayouts={
 lowerA:[['legpress','goblet','squat'],['legcurl','stepup','glutebridge'],['glutebridge','hipthrust','stepup'],['calfraise','sidewalk'],['hipabduction','sidewalk']],
 lowerB:[['goblet','legpress','squat'],['hipthrust','glutebridge','stepup'],['legcurl','stepup','glutebridge'],['calfraise','sidewalk'],['hipabduction','sidewalk']],
 upperA:[['chestpress','dumbbellpress','wallpush'],['latpull','seatedrow','bandpull','bird'],['shoulderpress','lateralraise','wallpush'],['seatedrow','bandpull','bird'],['bicepcurl','tricep','wallpush']],
 upperB:[['dumbbellpress','chestpress','wallpush'],['seatedrow','latpull','bandpull','bird'],['lateralraise','shoulderpress','wallpush'],['latpull','bandpull','bird'],['tricep','bicepcurl','wallpush']],
 fullA:[['legpress','goblet','squat'],['chestpress','dumbbellpress','wallpush'],['latpull','seatedrow','bandpull','bird'],['glutebridge','stepup'],['deadbug','plank']],
 fullB:[['squat','goblet','legpress'],['seatedrow','bandpull','latpull','bird'],['dumbbellpress','chestpress','wallpush'],['stepup','glutebridge'],['plank','deadbug']],
 cardio:[['treadmill','bike','elliptical','jumping'],['stretch','bird']]
};
const gymDays={2:[[0,'fullA'],[3,'fullB']],3:[[0,'fullA'],[2,'upperA'],[4,'lowerA']],4:[[0,'lowerA'],[1,'upperA'],[3,'lowerB'],[5,'upperB']],5:[[0,'lowerA'],[1,'upperA'],[2,'cardio'],[4,'lowerB'],[5,'upperB']],6:[[0,'lowerA'],[1,'upperA'],[2,'cardio'],[3,'lowerB'],[4,'upperB'],[5,'fullB']]};
function smartProfile(){return {...{goal:S.prefs.goal||'strength',level:S.prefs.level||'beginner',days:+S.prefs.days||4,minutes:+S.prefs.minutes||45,equipment:['machines','dumbbells','bodyweight'],special:false},...(S.smart?.assessment||{})}}
function permittedEquipment(ids){let chosen=Array.isArray(ids)?ids:['machines','dumbbells','bodyweight'];return new Set(chosen.flatMap(g=>EQUIP[g]||[]))}
function validChoice(id,assessment){return permittedEquipment(assessment.equipment).has(id)}
function sessionPattern(n,goal){let count=Math.max(2,Math.min(6,+n||4));let days=gymDays[count]||gymDays[4];if(goal==='fitness'||goal==='fatloss'){const moreCardio={3:[[0,'fullA'],[2,'cardio'],[4,'fullB']],4:[[0,'lowerA'],[1,'upperA'],[3,'cardio'],[5,'fullB']]};days=moreCardio[count]||days;}return days.map(([dow,label])=>[dow,label]);}
function trainingItem(id,level,goal,minutes){let e=EX[id];let cardio=e.group==='cardio';let sets=level==='beginner'?Math.min(e.sets,2):level==='advanced'?Math.min(4,Math.max(3,e.sets)):Math.min(3,e.sets);
 if(minutes<=30)sets=Math.min(sets,2);
 const reps=cardio?Math.max(3,Math.min(8,e.reps)):goal==='strength'?Math.min(12,Math.max(8,e.reps-2)):e.reps;
 const info=suggestWeight(id,sets,reps);
 return {id,sets,reps,kg:info.kg,rest:e.rest,source:info.source,weightMode:'auto',note:info.note};}
function latestExerciseResult(id){for(let li=0;li<S.logs.length;li++){let l=S.logs[li];if(l.pain)return {blocked:true,sets:[],expectedSets:0,targetReps:0};let matches=(l.sets||[]).filter(s=>s.id===id);if(!matches.length)continue;let idx=matches[matches.length-1].index;let m=matches.filter(x=>x.index===idx || (idx===undefined && x.id===id));if(!m.length)continue;let target=(l.prescriptions||[])[idx]||EX[id];return {sets:m,expectedSets:Number(target?.sets)||EX[id].sets,targetReps:Number(target?.reps)||EX[id].reps};}return null;}
function suggestWeight(id){let e=EX[id];if(!e)return {kg:0,source:'trial',note:'unknown'};if(S.smart?.assessment?.special)return {kg:Number(e.kg)||0,source:'trial',note:'precaution'};let w=lastWeight(id);if(w==null||!Number.isFinite(w))return{kg:Number(e.kg)||0,source:'trial',note:'first-try'};return{kg:Math.max(0,w),source:'history',note:'maintain-until-reviewed'}}
function buildSmartPlan(assessment){let days=sessionPattern(assessment.days,assessment.goal);let maxPer=assessment.minutes<=30?3:assessment.minutes<=45?4:assessment.minutes<=60?5:6;
 const scheduled=days.map(([dow,label],index)=>{
  let used=new Set(),candidate=[];
  for(let slot of dayLayouts[label]){let id=slot.find(x=>EX[x]&&validChoice(x,assessment)&&!used.has(x));if(id){used.add(id);candidate.push(id)}if(candidate.length>=maxPer)break;}
  if(candidate.length<Math.min(maxPer,3)){
   const extra=label.startsWith('lower')?workouts.lower:label.startsWith('upper')?workouts.upper:label==='cardio'?['treadmill','bike','elliptical','jumping','stretch']:workouts.full;
   for(const id of extra){
    if(EX[id]&&validChoice(id,assessment)&&!used.has(id)){used.add(id);candidate.push(id)}if(candidate.length>=maxPer)break;
   }
  }
  return {day:dow,type:label,index,exercises:candidate.map(id=>trainingItem(id,assessment.level,assessment.goal,assessment.minutes))};
 });
 return {id:'personal-'+Date.now(),createdAt:new Date().toISOString(),days:scheduled};
}
function getDailyPlan(){return S.smart?.plan?.days||[]}
function smartDayTitle(d){let parts={lowerA:'lower',lowerB:'lower',upperA:'upper',upperB:'upper',fullA:'full',fullB:'full',cardio:'cardio'};return t(parts[d.type]||'full')+(d.type.endsWith('B')?' B':d.type.endsWith('A')?' A':'')}
function smartStartDay(index){if(!S.smart?.plan)return go('planner');if(!v16CanStart())return;if(S.smart?.assessment?.special){showToast(t('smartBlockStart'));return}
 let d=getDailyPlan()[index];if(!d||!d.exercises?.length){showToast(t('smartNoExercises'));return}
 if(S.active&&!confirm(t('abandonConfirm')))return;
 S.active={type:d.type,smart:true,planId:S.smart.plan.id,planDay:index,started:new Date().toISOString(),exercises:d.exercises.map(x=>x.id),prescriptions:d.exercises.map(x=>({...x})),sets:[],restEnd:0,restRemain:0,paused:true,pain:false};
 v16AdaptSession(S.active);workoutIndex=0;S.active.currentIndex=0;effort='okay';persist();go('session');}
function showPlanner(mode='plan'){plannerMode=mode;go('planner')}
function generateSmartPlan(){const v=(id)=>document.getElementById(id)?.value;
 const equipment=['machines','dumbbells','bands','bodyweight'].filter(k=>document.getElementById('equip-'+k)?.checked);
 if(!equipment.length){showToast(t('smartNoEquipment'));return}
 const special=!!document.getElementById('specialCondition')?.checked;
 const assessment={goal:v('smartGoal'),level:v('smartLevel'),days:Number(v('smartDays')),minutes:Number(v('smartMinutes')),equipment,special};
 if(special){S.smart={assessment,plan:S.smart?.plan||null};persist();document.getElementById('smartAssessmentWarning')?.classList.remove('hide');showToast(t('smartPrecaution'));return}
 if(S.smart?.plan&&!confirm(t('smartResetConfirm')))return;
 const proposal=buildSmartPlan(assessment);if(proposal.days.some(d=>d.exercises.length<2)){showToast(t('smartNeedMore'));return}S.smart={assessment,plan:proposal};
 S.prefs={...S.prefs,goal:assessment.goal,level:assessment.level,days:assessment.days,minutes:assessment.minutes};S.setup=true;
 plannerMode='plan';persist();go('planner');showToast(t('smartGenerated'));}
function editSmartItem(dayIndex,itemIndex,field,value){const p=getDailyPlan()[dayIndex]?.exercises?.[itemIndex];if(!p)return;
 let n=Number(value);const range={sets:[1,5],reps:[1,40],kg:[0,300],rest:[15,240]};let r=range[field];if(!r||!Number.isFinite(n)||n<r[0]||n>r[1]){showToast(S.lang==='ar'?'قيمة غير صالحة':'Invalid value');render();return}
 if(field!=='kg')n=Math.round(n);if(field==='kg')n=Math.round(n*2)/2;
 p[field]=n;if(field==='kg'){p.weightMode='manual';p.source='manual'}else p.edited=true;
 persist();showToast(t('smartModified'));}
function swapSmartItem(dayIndex,itemIndex){let d=getDailyPlan()[dayIndex],p=d?.exercises[itemIndex];if(!p)return;
 const opts=[...(EX[p.id]?.alts||[]),...dayLayouts[d.type].flat()].filter(id=>EX[id]&&validChoice(id,S.smart.assessment)&&id!==p.id&&!d.exercises.some(x=>x.id===id));
 if(!opts.length){showToast(t('smartNoExercises'));return}
 const ni=opts[0]; d.exercises[itemIndex]=trainingItem(ni,S.smart.assessment.level,S.smart.assessment.goal,S.smart.assessment.minutes);
 persist();render();showToast(t('smartModified'));}
function removeSmartItem(dayIndex,itemIndex){let d=getDailyPlan()[dayIndex];if(!d||d.exercises.length<=2){showToast(S.lang==='ar'?'احتفظي بتمرينين على الأقل':'Keep at least two exercises');return}
 d.exercises.splice(itemIndex,1);persist();render();}
function addSmartItem(dayIndex){let d=getDailyPlan()[dayIndex],selected=document.getElementById('addExercise-'+dayIndex)?.value;if(!d||!EX[selected]||!validChoice(selected,S.smart.assessment)||d.exercises.some(x=>x.id===selected))return;
 d.exercises.push(trainingItem(selected,S.smart.assessment.level,S.smart.assessment.goal,S.smart.assessment.minutes));persist();render();showToast(t('smartModified'));}
function refreshSmartWeights(notify=true){if(!S.smart?.plan)return;showPlanner('plan');if(notify)showToast(v16t('reviewIntro'));}
function stopOnPain(){if(!S.active||!confirm(t('smartPainConfirm')))return;S.active.pain=true;S.active.paused=true;S.active.restEnd=0;
 const log={type:S.active.type,smart:!!S.active.smart,pain:true,started:S.active.started,finished:new Date().toISOString(),sets:[...S.active.sets],prescriptions:S.active.prescriptions||null};
 S.logs.unshift(log);lastSummary=log;S.active=null;if(S.smart?.assessment)S.smart.assessment.special=true;persist();go('complete');showToast(t('smartPainSaved'));}
function smartAssessmentView(){const a=smartProfile();return `<section class="screen"><button class="backlink" onclick="showPlanner('plan')">${S.lang==='ar'?'→':'←'} ${t('smartTab')}</button><div class="v14-pill">✦ HER FIT AI v1.9</div><h1 class="title">${t('smartAssessment')} ✨</h1><p class="muted small" style="line-height:1.8">${t('smartIntro')}</p><div class="card smart-form"><label class="field">${t('smartGoal')}<select id="smartGoal">${['strength','fitness','fatloss'].map(x=>`<option value="${x}" ${a.goal===x?'selected':''}>${t(x)}</option>`).join('')}</select></label><label class="field">${t('smartExperience')}<select id="smartLevel">${['beginner','intermediate','advanced'].map(x=>`<option value="${x}" ${a.level===x?'selected':''}>${t(x)}</option>`).join('')}</select></label><label class="field">${t('smartDays')}<select id="smartDays">${[2,3,4,5,6].map(x=>`<option value="${x}" ${a.days===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">${t('smartMinutes')}<select id="smartMinutes">${[30,45,60,90].map(x=>`<option value="${x}" ${a.minutes===x?'selected':''}>${x} ${t('smartMinutesUnit')}</option>`).join('')}</select></label><div style="font-weight:800;font-size:13px;margin-top:17px">${t('smartEquipment')}</div><p class="microtext">${t('smartEquipmentHint')}</p><div class="choicegrid">${[['machines','🏟️',S.lang==='ar'?'أجهزة النادي':'Gym machines'],['dumbbells','🏋️',S.lang==='ar'?'دمبل':'Dumbbells'],['bands','〰️',S.lang==='ar'?'شرائط مقاومة':'Resistance bands'],['bodyweight','🤸',S.lang==='ar'?'وزن الجسم':'Bodyweight']].map(([id,icon,label])=>`<label class="choice"><input id="equip-${id}" type="checkbox" ${a.equipment.includes(id)?'checked':''}><span>${icon} ${label}</span></label>`).join('')}</div><div class="smart-warning" style="margin-top:15px"><label style="display:flex;align-items:flex-start;gap:10px"><input type="checkbox" id="specialCondition" ${a.special?'checked':''} style="margin-top:5px;accent-color:#926bcb"><span><b>${t('smartConditions')}</b><br>${t('smartConditionText')}</span></label></div><div class="smart-warning hide" id="smartAssessmentWarning">⚠️ ${t('smartConditionWarning')}</div>${button('✨ '+t('smartStart'),'generateSmartPlan()','full')}</div><p class="microtext">🔒 ${t('smartPrivacy')}</p><p class="safe-note">⚠️ ${t('smartSafety')}</p></section>`}
function smartPlanView(){let plan=S.smart?.plan;if(!plan)return `<section class="screen"><div class="plan-empty"><div class="figure">🌸</div><h1>${t('smartPlanWelcome')}</h1><p>${t('smartPlanMissing')}</p>${button(t('smartStart'),"showPlanner('assessment')",'full')}</div></section>`;
 const a=S.smart.assessment,all=getDailyPlan();let count=all.reduce((n,d)=>n+d.exercises.length,0);let days=selectWeekDays();let allowed=[...permittedEquipment(a.equipment)].filter(id=>EX[id]);
 return `<section class="screen"><div class="v14-pill">✨ ${t('smartNew')} · HER FIT AI v1.9</div><h1 class="title">${t('smartTitle')}</h1><p class="muted small" style="line-height:1.7">${t('smartIntro')}</p><div class="planbar"><div class="planmetric"><strong>${all.length}</strong><small>${t('smartDays')}</small></div><div class="planmetric"><strong>${count}</strong><small>${t('smartExerciseCount')}</small></div><div class="planmetric"><strong>${a.minutes}</strong><small>${t('smartMinutesUnit')}</small></div></div><div class="plan-tools">${button('✎ '+t('smartEdit'),"showPlanner('assessment')",'secondary')}${button('↻ '+t('smartUpdate'),'refreshSmartWeights()','secondary')}</div>${a.special?`<div class="smart-warning">⚠️ ${t('smartConditionWarning')}</div>`:''}${v16ReviewPanel()}<div class="smart-ok">✨ ${t('smartChange')} ${t('smartAutoNote')}</div>${all.map((d,di)=>{let options=allowed.filter(id=>!d.exercises.some(e=>e.id===id));return `<div class="sday"><div class="sdayheader"><span class="sdayicon">${d.type==='cardio'?'💗':d.type.startsWith('lower')?'🦵':d.type.startsWith('upper')?'💪':'🌼'}</span><div class="stitle"><strong>${days[d.day]} · ${smartDayTitle(d)}</strong><small>${d.exercises.length} ${t('smartExerciseCount')} · ${a.minutes} ${t('smartMinutesUnit')}</small></div><button onclick="smartStartDay(${di})">▶ ${t('smartStartDay')}</button></div><div class="sdaybody">${d.exercises.map((p,pi)=>{let e=EX[p.id];return `<div class="srow"><div class="srowtop"><div class="simg">${art(p.id)}</div><div class="sinfo"><b>${exerciseName(p.id)}</b><small>${esc(e.muscle[S.lang])}</small></div><button onclick="swapSmartItem(${di},${pi})">⇄ ${t('smartSwap')}</button></div><div class="editfields"><label>${t('smartSets')}<input type="number" inputmode="numeric" value="${p.sets}" min="1" max="5" onchange="editSmartItem(${di},${pi},'sets',this.value)"></label><label>${e.group==='cardio'?t('smartMinutesUnit'):t('smartReps')}<input type="number" inputmode="numeric" value="${p.reps} let v199RetryCount=0,v199RetryHandle=null;
async function syncCloud(){
 if(!cfg.ready||!cloudAuth||!navigator.onLine||cloudBusy)return;
 const id=cloudAuth.user.id;
 if(safeGet(v15Dirty(id))!=='1')return;
 cloudBusy=true;cloudSetStatus('syncing');
 const epoch=cloudEpoch,snapshot=JSON.parse(JSON.stringify(cloudSnapshot()));
 let rev=Number(safeGet(v15Rev(id))||0);
 try{
  let rows;
  if(!rev){
   rows=await db('POST','herfit_state',{user_id:id,data:snapshot,revision:1},'resolution=ignore-duplicates,return=representation');
   if(!Array.isArray(rows)||rows.length===0)throw Error('CONFLICT');rev=1;
  }else{
   rows=await db('PATCH',stateQuery(rev),{data:snapshot,revision:rev+1,updated_at:new Date().toISOString()},'return=representation');
   if(!Array.isArray(rows)||rows.length===0)throw Error('CONFLICT');rev++;
  }
  if(!cloudAuth||cloudAuth.user.id!==id)return;
  safeSet(v15Rev(id),String(rev));
  safeSet('HERFIT_V199_LAST_'+id,new Date().toISOString());

  if(epoch===cloudEpoch){safeDel(v15Dirty(id));cloudSetStatus('synced')}
  else{cloudSetStatus('pending');clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,1700)}
 }catch(e){
  const conflict=e.message==='CONFLICT';cloudSetStatus(conflict?'conflict':'offline');
  if(conflict){showToast((S.lang==='ar'?'تعارض مزامنة. افتحي مركز الخصوصية لاختيار النسخة بعد تنزيل نسخة احتياطية.':'Sync conflict. Open Privacy Center and back up both versions.'))}
  else{
   showToast(ct('cloudFail')+': '+String(e.message||'network').slice(0,100));
   if(navigator.onLine){v199RetryCount=Math.min(7,v199RetryCount+1);clearTimeout(v199RetryHandle);v199RetryHandle=setTimeout(()=>{if(cloudAuth?.user?.id===id&&safeGet(v15Dirty(id))==='1')syncCloud()},Math.min(120000,2000*2**v199RetryCount))}
  }
 }finally{cloudBusy=false}
}

async function cloudSubmit(mode){if(!cfg.ready||cloudSubmitting)return;let email=document.getElementById('cloudEmail')?.value.trim().toLowerCase()||'',password=document.getElementById('cloudPassword')?.value||'';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast(ct('emailBad'));return}if(mode!=='forgot'&&password.length<8){showToast(ct('passwordBad'));return}cloudSubmitting=true;const el=document.getElementById('cloudSubmit');if(el)el.disabled=true;
try{if(mode==='forgot'){await cloudHTTP(cfg.url+'/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email})});showToast(ct('recovered'));return}

function v16t(k){return V16T[S.lang]?.[k]||k}
function v16State(){if(!S.recovery||typeof S.recovery!=='object')S.recovery={checkins:[]};if(!Array.isArray(S.recovery.checkins))S.recovery.checkins=[];return S.recovery}
function v16Today(){return localYMD(new Date())}
function v16Checkin(){return v16State().checkins.find(x=>x.date===v16Today())||null}
function v16Mode(c=v16Checkin()){
 if(S.smart?.assessment?.special)return 'blocked';
 if(!c)return 'unknown';
 if(c.pain||c.symptoms)return 'blocked';
 const energy=Number(c.energy),soreness=Number(c.soreness),stress=Number(c.stress),sleep=c.sleep==null?null:Number(c.sleep);
 if(!Number.isFinite(energy)||!Number.isFinite(soreness)||!Number.isFinite(stress))return 'unknown';
 if(energy<=2||soreness>=7||stress>=5||(sleep!==null&&sleep<5))return 'low';
 if(energy===3||soreness>=4||stress>=4||(sleep!==null&&sleep<7)||sleep===null)return 'moderate';
 return 'ready';
}
function v16StatusBadge(mode){const code=mode==='blocked'?'low':mode;return `<span class="v16-status ${code}">${v16t(mode)}</span>`}
function v16StatusDescription(mode){return v16t(mode+'Desc')||v16t('how')}
function v16HomeCard(){const mode=v16Mode(),c=v16Checkin();return `<div class="v16-card"><div class="v16-topline"><span class="v16-badge">🌿 ${v16t('tag')}</span>${v16StatusBadge(mode)}</div><h2>🌱 ${v16t('title')}</h2><p class="muted small" style="margin:7px 0">${esc(v16StatusDescription(mode))}</p>${c?`<p class="microtext">${v16t('last')}: ${fmtDate(c.at)} · ${v16t('energy')} ${c.energy}/5</p>`:`<p class="microtext">${v16t('none')}</p>`}<button class="btn secondary full" onclick="go('recovery')">${v16t('go')} ↗</button></div>`}
function v16RecoveryView(){const c=v16Checkin();let mode=v16Mode();return `<section class="screen"><button class="backlink" onclick="go('home')">${S.lang==='ar'?'→':'←'} ${t('home')}</button><span class="v16-badge">🌿 ${v16t('tag')}</span><h1 class="title">${v16t('title')}</h1><div class="v16-card"><div class="v16-topline"><strong>${v16t('newer')}</strong>${v16StatusBadge(mode)}</div><p class="microtext">${esc(v16StatusDescription(mode))}</p>${mode==='blocked'?`<div class="v16-warning">⚠️ ${v16t('safety')}</div>`:''}</div><div class="card"><h2 style="font-size:18px;margin-top:0">${v16t('new')} 📅</h2><p class="microtext">${v16t('choose')}</p><div class="v16-flow"><label>${v16t('sleep')}<select id="v16Sleep"><option value="" ${c?.sleep==null?'selected':''}>${v16t('sleepSkip')}</option>${[3,4,5,6,7,8,9,10,11].map(h=>`<option value="${h}" ${c?.sleep===h?'selected':''}>${h}</option>`).join('')}</select></label><label>${v16t('energy')} (1–5)<select id="v16Energy">${[1,2,3,4,5].map(x=>`<option value="${x}" ${x===(c?.energy??3)?'selected':''}>${x}</option>`).join('')}</select></label><label>${v16t('soreness')} (0–10)<select id="v16Soreness">${Array.from({length:11},(_,x)=>`<option value="${x}" ${x===(c?.soreness??0)?'selected':''}>${x}</option>`).join('')}</select></label><label>${v16t('stress')} (1–5)<select id="v16Stress">${[1,2,3,4,5].map(x=>`<option value="${x}" ${x===(c?.stress??2)?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="v16-flag"><input id="v16Pain" type="checkbox" ${c?.pain?'checked':''}><span>${v16t('pain')}</span></label><label class="v16-flag"><input id="v16Symptoms" type="checkbox" ${c?.symptoms?'checked':''}><span>${v16t('symptoms')}</span></label><button class="btn full" onclick="v16SaveCheckin()">✓ ${v16t('save')}</button></div><div class="v16-privacy">🔒 ${v16t('privacy')}</div><div class="v16-warning">⚠️ ${v16t('safety')}</div><div class="v16-card"><h2>${v16t('history')}</h2>${v16State().checkins.length?`<div class="v16-readiness-history">${v16State().checkins.slice(0,7).map(x=>`<span>${esc(x.date)} · ⚡ ${x.energy}/5</span>`).join('')}</div>`:`<p class="microtext">${v16t('none')}</p>`}<button class="btn secondary full" onclick="v16ClearCheckins()">${v16t('clear')}</button></div><p class="microtext">${v16t('how')}</p></section>`}
function v16SaveCheckin(){const val=(id)=>document.getElementById(id)?.value;
 const energy=Number(val('v16Energy')),soreness=Number(val('v16Soreness')),stress=Number(val('v16Stress'));
 const rawSleep=val('v16Sleep');const sleep=rawSleep===''?null:Number(rawSleep);
 if(![energy,stress].every(v=>Number.isInteger(v)&&v>=1&&v<=5)||!Number.isInteger(soreness)||soreness<0||soreness>10||(sleep!==null&&(!Number.isInteger(sleep)||sleep<3||sleep>11))){showToast(v16t('choose'));return}
 let d=v16State();const item={date:v16Today(),at:new Date().toISOString(),sleep,energy,soreness,stress,pain:!!document.getElementById('v16Pain')?.checked,symptoms:!!document.getElementById('v16Symptoms')?.checked};d.checkins=[item,...d.checkins.filter(x=>x.date!==item.date)].slice(0,90);persist();render();showToast(v16t('saved'))}
function v16ClearCheckins(){if(!confirm(v16t('confirmClear')))return;v16State().checkins=[];persist();render()}
function v16CanStart(){let mode=v16Mode();if(mode==='blocked'){showToast(v16t('noStart'));return false}if(mode==='low'&&!confirm(v16t('lowConfirm')))return false;return true}
function v16AdaptSession(a){if(!a?.prescriptions)return;let mode=v16Mode();a.recoveryMode=mode;if(mode!=='moderate'&&mode!=='low')return;
 const reduction=mode==='low'?.15:.1;a.recoveryAdapted=true;a.prescriptions=a.prescriptions.map(p=>({...p,sets:Math.max(1,p.sets-1),kg:p.kg>0?Math.floor(p.kg*(1-reduction)*2)/2:0,rest:Math.min(240,p.rest+30),recoveryAdjusted:true}));}
function v16SessionNote(){if(!S.active)return '';let mode=S.active.recoveryMode||v16Mode();let kind=S.active.recoveryAdapted?'sessionLight':mode==='unknown'?'sessionUnknown':'sessionNormal';return `<div class="${mode==='blocked'?'v16-warning':'v16-alert'}">🌿 ${v16t(kind)} ${S.active.recoveryAdapted?'('+v16t(mode)+')':''} <button class="linkbtn" onclick="go('recovery')">${v16t('warningLink')}</button></div>`}
function v16GetExerciseSessions(id){return S.logs.filter(l=>!l.pain).flatMap(l=>{const sets=(l.sets||[]).filter(s=>s.id===id);if(!sets.length)return [];let indexes=[...new Set(sets.map(s=>s.index))];return indexes.map(idx=>{let selection=sets.filter(s=>s.index===idx);let p=l.prescriptions?.[idx]||EX[id];return {date:new Date(l.finished),sets:selection,expected:Number(p?.sets)||EX[id].sets,reps:Number(p?.reps)||EX[id].reps,recoveryMode:l.recoveryMode||'unknown'};})}).filter(x=>!Number.isNaN(+x.date)).sort((a,b)=>b.date-a.date)}
function v16Proposal(p){if(!p||p.weightMode==='manual'||!EX[p.id]||EX[p.id].group==='cardio')return null;
 const recent=v16GetExerciseSessions(p.id);if(!recent.length)return null;
 const a=recent[0],b=recent.find(x=>localYMD(x.date)!==localYMD(a.date));if(!b)return null;
 if(Date.now()-a.date.getTime()>21*86400000)return null;
 const enough=x=>x.sets.length>=x.expected&&x.sets.every(s=>s.reps>=x.reps&&s.effort!=='hard');
 const easy=x=>x.recoveryMode==='ready'&&enough(x)&&x.sets.every(s=>s.effort==='easy'||Number(s.reps)>=x.reps+1);
 const struggle=x=>x.sets.length<x.expected||x.sets.some(s=>s.effort==='hard'&&Number(s.reps)<x.reps);
 const weights=a.sets.map(x=>Number(x.kg)).filter(Number.isFinite);const base=weights.at(-1);if(base==null||!Number.isFinite(base)||Math.abs(Number(p.kg)-base)>0.001)return null;
 const mode=v16Mode();if(mode==='blocked'||S.smart?.assessment?.special)return null;
 const prevWeight=Number(b.sets.at(-1)?.kg);if(Math.abs(prevWeight-base)>0.001)return null;
 if(struggle(a)&&struggle(b)){
   if(base<=0)return null;
   const low=Math.max(0,Math.floor(base*.95*2)/2);if(low>=base)return null;
   return {type:'reduce',kg:low,old:base,reason:v16t('reduce')};
 }
 if(mode!=='ready'||!easy(a)||!easy(b))return null;
 if(base===0)return {type:'reps',reps:Math.min(40,Number(p.reps)+1),old:p.reps,reason:v16t('addedReps')};
 let candidate=Math.ceil(base*1.025*2)/2;
 if(candidate<=base||candidate/base>1.05)return {type:'reps',reps:Math.min(40,Number(p.reps)+1),old:p.reps,reason:v16t('addedReps')};
 return {type:'increase',kg:candidate,old:base,reason:v16t('increase')};
}
function v16ReviewPanel(){if(!S.smart?.plan)return '';
 let options=[];for(const [di,day] of getDailyPlan().entries())for(const [pi,p] of day.exercises.entries()){let r=v16Proposal(p);if(r&&(r.type!=='reps'||r.reps>r.old))options.push({di,pi,p,r})}
 const mode=v16Mode();return `<div class="v16-card"><div class="v16-topline"><h2>📈 ${v16t('reviews')}</h2>${v16StatusBadge(mode)}</div><p class="microtext">${v16t('noRisk')}</p>${options.length?`<div class="v16-reviewlist">${options.map(({di,pi,p,r})=>`<div class="v16-rec"><h3>${exerciseName(p.id)} · ${r.reason}</h3><div class="v16-line"><span class="microtext">${r.old} → <b>${r.type==='reps'?r.reps:r.kg}</b> ${r.type==='reps'?t('reps'):t('weight')}</span><button onclick="v16Apply(${di},${pi})">${v16t('apply')}</button></div></div>`).join('')}</div>`:`<div class="v16-alert">${v16t('reviewEmpty')}</div>`}<button class="btn secondary full" onclick="go('recovery')">🌿 ${v16t('go')}</button></div>`}
function v16Apply(di,pi){let p=getDailyPlan()[di]?.exercises?.[pi],r=v16Proposal(p);if(!r||!confirm(v16t('confirmApply')))return;
 if(r.type==='reps'){p.reps=r.reps;p.edited=true}else{p.kg=r.kg;p.source='reviewed';p.note=r.type;p.weightMode='reviewed'}
 let q=v16State();q.applied=Array.isArray(q.applied)?q.applied:[];q.applied.unshift({id:p.id,type:r.type,old:r.old,new:r.kg??r.reps,at:new Date().toISOString()});q.applied=q.applied.slice(0,100);
 persist();render();showToast(v16t('applied'))}
function v16ProgressPanel(){let cs=v16State().checkins.slice(0,7);let changed=v16State().applied||[];return `<div class="v16-card"><div class="v16-topline"><h2>🌿 ${v16t('today')}</h2>${v16StatusBadge(v16Mode())}</div><p class="microtext">${v16t('how')}</p><p class="microtext">${v16t('daily')}: ${cs.length}</p>${cs.length?`<div class="v16-readiness-history">${cs.map(c=>`<span>${esc(c.date)} · ⚡${c.energy}/5</span>`).join('')}</div>`:''}<div class="v16-topline"><small class="muted">${v16t('reviews')}: ${changed.length}</small><button class="linkbtn" onclick="go('recovery')">${v16t('go')} ↗</button></div></div>`}

function v19ExerciseRows(){const groups=new Map();for(const l of v19AllLogs()){let bySession=new Map();for(const s of v19Sets(l)){const id=String(s.id||'');const kg=Number(s.kg);if(!id||!Number.isFinite(kg)||kg<=0)continue;bySession.set(id,Math.max(bySession.get(id)||0,kg))}for(const [id,kg] of bySession){let items=groups.get(id)||[];items.push({kg,finished:l.finished});groups.set(id,items)}}return [...groups.entries()].map(([id,items])=>({id,items,best:Math.max(...items.map(i=>i.kg)),recent:items[items.length-1].kg,first:items[0].kg,latest:items[items.length-1].finished})).sort((a,b)=>new Date(b.latest)-new Date(a.latest))}

function v19StrengthView(){let rows=v19ExerciseRows();if(!rows.length)return `<div class="v19-empty"><span>📈</span><p>${v19t('noExercise')}</p><button class="btn" onclick="go('workouts')">${v19t('startWorkout')}</button></div>`;
