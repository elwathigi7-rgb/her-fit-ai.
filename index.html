function lastWeight(id){for(const l of S.logs){for(const s of [...(l.sets||[])].reverse()){if(s.id===id&&Number.isFinite(+s.kg))return +s.kg}}return null}
function currentDayPlan(){let types=['lower','upper','full','cardio','lower'];let d=Math.max(2,Math.min(5,+S.prefs.days||4));let days=[0,1,3,4,5].slice(0,d);return Array.from({length:7},(_,i)=>({day:i,type:days.includes(i)?types[days.indexOf(i)]:null}))}

 return `<section class="screen"><div class="minihead"><span class="week-chip">✦ ${t('template')} · v1.3</span><span>${new Date().toLocaleDateString(S.lang==='ar'?'ar-AE':'en-GB',{month:'long',day:'numeric'})}</span></div><div class="sectiontop" style="margin-top:13px"><h2 class="title">${nm?`${S.lang==='ar'?'مرحبًا':'Hi'}, ${nm} 🌷`:t('hello')+' 🌷'}</h2></div><div class="vhero"><span class="micro">✨ ${t('today')}</span><h1>${t('welcomeBack')}</h1><p>${t('heroSub')}</p><button onclick="${S.active?'resumeWorkout()':`startPlan('${typ}')`}">${S.active?'▶ '+t('resume'):t('startWorkout')+' ↗'}</button><div class="orb" aria-hidden="true">🏋️‍♀️</div></div><div class="sectiontop"><h2>${t('weekly')}</h2><span class="vbadge mint">● ${t('realStats')}</span></div><div class="vgrid"><div class="vstat"><div class="vico">🏆</div><strong>${week.length}</strong><small>${t('sessions')}</small></div><div class="vstat"><div class="vico">✓</div><strong>${setCount}</strong><small>${t('sets')}</small></div><div class="vstat"><div class="vico">📅</div><strong>${days}</strong><small>${t('trainDays')}</small></div></div><div class="sectiontop"><h2>${t('today')} · ${t(typ)}</h2><button class="linkbtn" onclick="go('workouts')">${t('viewMore')} ↗</button></div><div class="card workout-preview"><div class="cover">${programArt(typ)}</div><div class="copy"><b>${t(typ)}</b><p>${prog.length} ${t('exercises')} · ${S.prefs.minutes} ${t('minute')}</p><button onclick="${S.active?'resumeWorkout()':`startPlan('${typ}')`}">${S.active?t('resume'):t('begin')}</button></div></div><div class="sectiontop"><h2>${t('nextSteps')}</h2><button class="linkbtn" onclick="tab='library';go('workouts')">${t('browse')} ↗</button></div>${prog.slice(0,2).map(id=>`<div class="exercise-item" style="margin-bottom:9px"><div class="exercise-thumb">${art(id)}</div><div class="info"><h3>${exerciseName(id)}</h3><p>${EX[id].sets} × ${EX[id].reps} · ${EX[id].rest}s ${t('rest')}</p></div><button onclick="openGuide('${id}','library')">${t('details')}</button></div>`).join('')}<p class="sitefoot">HER FIT AI · ${t('template')}</p></section>`}
function programs(){return `<section class="screen"><h1 class="title">${t('plan')} 💜</h1><p class="muted small">${t('programCta')}</p><div class="filters" style="margin-top:15px"><button class="filter ${tab==='programs'?'active':''}" onclick="selectTab('programs')">${t('programs')}</button><button class="filter ${tab==='library'?'active':''}" onclick="selectTab('library')">${t('library')}</button></div>${tab==='programs'?`<div class="program-grid">${nameKeys.map((k,i)=>`<div class="program"><div class="program-art p${i+1}">${programArt(k)}</div><b>${t(k)}</b><p>${workouts[k].length} ${t('exercises')} · ${S.prefs.minutes} ${t('minute')}</p><button onclick="startPlan('${k}')">${t('startWorkout')}</button></div>`).join('')}</div><div class="sectiontop"><h2>${t('library')}</h2><button class="linkbtn" onclick="selectTab('library')">${t('allExercises')} ↗</button></div>${exerciseData.slice(0,3).map(d=>`<div class="exercise-item" style="margin-bottom:9px"><div class="exercise-thumb">${art(d[0])}</div><div class="info"><h3>${exerciseName(d[0])}</h3><p>${esc(EX[d[0]].muscle[S.lang])}</p></div><button onclick="openGuide('${d[0]}','library')">${t('details')}</button></div>`).join('')}`:
 `<div class="searchbox">🔎 <input id="exerciseSearch" autocomplete="off" placeholder="${t('search')}" oninput="searchLibrary(this.value)" value="${esc(query)}"></div><div class="filters">${['all','lower','upper','core','cardio'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="selectFilter('${f}')">${t(f)}</button>`).join('')}</div><div id="libraryResults">${libraryResults()}</div>`}</section>`}
function guide(){let e=EX[guideId]||EX.legpress;return `<section class="screen"><button class="backlink" onclick="closeGuide()">${S.lang==='ar'?'→':'←'} ${t('close')}</button><div class="guide-art">${art(e.id)}<span class="artbadge">${t('diagram')}</span></div><h1 class="guide-title">${exerciseName(e.id)}</h1><p class="guide-sub">${S.lang==='ar'?esc(e.en):esc(e.ar)}</p><div class="pill-row"><span class="vbadge">${t(e.group)}</span><span class="vbadge mint">${e.sets} × ${e.reps}</span><span class="vbadge rose">⏱ ${e.rest}s ${t('rest')}</span></div><div class="detailgrid"><div><small>${t('muscles')}</small><b>${esc(e.muscle[S.lang])}</b></div><div><small>${t('equipment')}</small><b>${esc(e.equipment[S.lang])}</b></div></div><div class="card"><h2 class="sectiontitle" style="margin-top:0">${t('instructions')}</h2><ol class="steps">${e.steps[S.lang].map((step,i)=>`<li><span class="stepnum">${i+1}</span><span>${esc(step)}</span></li>`).join('')}</ol></div><p class="safe-note">⚠️ ${t('safety')}</p>${fromGuide==='session'?button(t('backToWorkout'),"go('session')",'full'):button(t('startWorkout'),`startSingle('${e.id}')`,'full')}</section>`}
function session(){if(!S.active){page='home';return home()}const all=currentPlan(),id=selectedExercise(),e=EX[id],n=countFor(workoutIndex),done=S.active.sets.length,total=sessionTotal(),last=lastWeight(id),sw=last!==null?last:e.kg;tickRest();let rows=Array.from({length:e.sets},(_,i)=>{let logged=S.active.sets.filter(s=>s.index===workoutIndex)[i];return `<tr class="${logged?'checked':''}"><td>${i+1}</td><td>${logged?esc(logged.kg):'—'}</td><td>${logged?logged.reps:e.reps}</td><td>${logged?'✓':'○'}</td></tr>`}).join('');
 return `<section class="screen"><div class="worktop session-header"><button class="backlink" onclick="go('home')">${S.lang==='ar'?'→':'←'} ${t('home')}</button><span class="vbadge">${t('workout')} · ${workoutIndex+1}/${all.length}</span></div><div class="progress-line" aria-label="${t('progressLine')}"><div style="width:${total?Math.min(100,done/total*100):0}%"></div></div><p class="microtext">${done} / ${total} ${t('sets')} · ${t('progressLine')}</p><div class="card train-card"><div class="train-art">${art(id)}</div><h1 class="title" style="margin:8px 0 5px">${exerciseName(id)}</h1><p class="muted small" style="margin:0 0 12px">${S.lang==='ar'?esc(e.en):esc(e.ar)} · ${esc(e.muscle[S.lang])}</p><div class="pill-row"><span class="vbadge">${e.sets} ${t('sets')}</span><span class="vbadge mint">${e.reps} ${t('reps')}</span><span class="vbadge rose">${e.rest}s ${t('rest')}</span></div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="openGuide('${id}','session')">ⓘ ${t('guideButton')}</button><button class="btn secondary" onclick="swapExercise()">⇄ ${t('swap')}</button></div></div><div class="card train-card"><div class="row"><h2 class="sectiontitle" style="margin:0">${t('sets')}</h2><span class="vbadge mint">${n}/${e.sets} ${t('completed')}</span></div><table class="train-sets"><thead><tr><th>${t('set')}</th><th>${t('weight')}</th><th>${t('reps')}</th><th>✓</th></tr></thead><tbody>${rows}</tbody></table>${n<e.sets?`<div class="entrygrid"><label>${t('weight')}<input inputmode="decimal" type="number" id="weightInput" min="0" max="1000" step="0.5" value="${sw}"></label><label>${t('reps')}<input inputmode="numeric" type="number" id="repsInput" min="1" max="100" step="1" value="${e.reps}"></label></div><p class="microtext">${last!==null?t('lastWeight')+': '+last+' kg':t('exampleWeight')}</p><p class="small-title">${t('effort')}</p><div class="effort-picker">${['easy','okay','hard'].map(x=>`<button data-effort="${x}" class="${effort===x?'on':''}" onclick="setEffort('${x}')">${t(x)}</button>`).join('')}</div>${button('✓ '+t('logSet'),'logSet()','full')}`:`<div class="notice" style="margin-top:14px">✓ ${t('allDone')}</div>`}</div><div class="timerbox"><div class="small-title">⏱ ${t('restTimer')}</div><div class="digits" id="timerCountdown">${formatTime(S.active.restRemain||0)}</div><div class="timeractions"><button onclick="setTimer('${S.active.paused?'resume':'pause'}')">${S.active.paused?t('resumeTimer'):t('pause')}</button><button onclick="setTimer('reset')">${t('resetTimer')}</button><button onclick="setTimer('skip')">${t('skipRest')}</button></div></div><p class="notice">🌿 ${t('warmup')}</p><div class="session-bottom"><button class="btn secondary" onclick="moveExercise(-1)" ${workoutIndex===0?'disabled':''}>${S.lang==='ar'?'→':'←'} ${t('previous')}</button>${workoutIndex<all.length-1?`<button class="btn" onclick="moveExercise(1)">${t('next')} ${S.lang==='ar'?'←':'→'}</button>`:`<button class="btn" onclick="finishWorkout()">${t('finish')}</button>`}</div><div style="margin-top:10px">${button(t('finish'),'finishWorkout()','secondary full')}</div></section>`}
function calendar(){let days=selectWeekDays(),plan=currentDayPlan();return `<section class="screen"><h1 class="title">${t('calendarTitle')} 📆</h1><div class="card"><div class="minihead">${S.prefs.days} ${t('trainDays')} · ${S.prefs.minutes} ${t('minute')}</div><div class="timeline" style="margin-top:14px">${plan.map((d,i)=>`<div class="daycard"><div class="daybadge">${days[i]}</div><div style="flex:1;min-width:0"><b style="font-size:13px">${d.type?t(d.type):t('restDay')}</b><div class="muted small">${d.type?workouts[d.type].length+' '+t('exercises')+' · '+S.prefs.minutes+' '+t('minute'):'🌿'}</div></div>${d.type?`<button class="btn secondary" style="padding:8px 11px" onclick="startPlan('${d.type}')">▶</button>`:`<span style="font-size:18px">☘</span>`}</div>`).join('')}</div></div><p class="info-note">${t('weekNote')}</p></section>`}
function progress(){let logs=S.logs;let all=logs.reduce((v,l)=>v+(l.sets?.length||0),0);let totalMin=logs.reduce((v,l)=>v+Math.max(1,Math.round((new Date(l.finished)-new Date(l.started))/60000)),0);
 const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);let dayKey=localYMD(d);return {name:d.toLocaleDateString(S.lang==='ar'?'ar-AE':'en-US',{weekday:'short'}),sets:logs.filter(l=>localYMD(l.finished)===dayKey).reduce((n,l)=>n+(l.sets?.length||0),0)}});let max=Math.max(1,...days.map(x=>x.sets));
 return `<section class="screen"><h1 class="title">${t('progress')} 📊</h1><p class="muted small">${t('actual')}</p><div class="vgrid"><div class="vstat"><div class="vico">🏆</div><strong>${logs.length}</strong><small>${t('sessions')}</small></div><div class="vstat"><div class="vico">✓</div><strong>${all}</strong><small>${t('sets')}</small></div><div class="vstat"><div class="vico">⏱</div><strong>${totalMin}</strong><small>${t('minute')}</small></div></div><div class="sectiontop"><h2>${t('weeklySets')}</h2></div><div class="card"><div class="chart-row" style="height:155px;align-items:flex-end">${days.map(x=>`<div class="chart-group"><b style="font-size:10px;color:#8a7e9c">${x.sets||''}</b><div class="chart-bar" style="width:27px;height:${Math.max(4,Math.round(x.sets/max*112))}px"></div><small class="chart-unit">${x.name}</small></div>`).join('')}</div>${logs.length?'':`<p class="microtext">${t('noChart')}</p>`}</div><div class="sectiontop"><h2>${t('history')}</h2></div>${logs.length?logs.slice(0,20).map(l=>`<div class="card row"><div><b>${nameKeys.includes(l.type)?t(l.type):exerciseName(l.type)}</b><p class="muted small" style="margin:4px 0 0">${fmtDate(l.finished)} · ${Math.max(1,Math.round((new Date(l.finished)-new Date(l.started))/60000))} ${t('minute')}</p></div><span class="vbadge mint">${l.sets?.length||0} ${t('sets')}</span></div>`).join(''):`<div class="empty-state"><div class="emoji">📈</div><p>${t('empty')}</p>${button(t('startWorkout'),"go('workouts')",'secondary')}</div>`}</section>`}
function profile(){return `<section class="screen"><h1 class="title">${t('profileTitle')} 👤</h1><div class="card"><label class="field">${t('name')}<input id="prefName" maxlength="35" placeholder="${t('namePlaceholder')}" value="${esc(S.prefs.name)}"></label><label class="field">${t('goal')}<select id="prefGoal">${['strength','fitness','fatloss'].map(k=>`<option value="${k}" ${S.prefs.goal===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field">${t('level')}<select id="prefLevel">${['beginner','intermediate','advanced'].map(k=>`<option value="${k}" ${S.prefs.level===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field">${t('days')}<select id="prefDays">${[2,3,4,5].map(x=>`<option value="${x}" ${+S.prefs.days===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">${t('minutes')}<select id="prefMinutes">${[30,45,60].map(x=>`<option value="${x}" ${+S.prefs.minutes===x?'selected':''}>${x}</option>`).join('')}</select></label>${button(t('save'),'saveProfile()','full')}</div><div class="card"><h3>${t('privacy')} 🔒</h3><p class="muted small">${t('privacyDesc')}</p></div>${button(t('resetAll'),'resetAll()','secondary full')}</section>`}
function complete(){let l=lastSummary||S.logs[0];return `<section class="screen"><div class="complete-hero"><div class="trophy">🏆</div><h1 class="title">${t('congrats')}</h1><p class="muted">${t('saved')}</p></div><div class="sectiontop"><h2>${t('summary')}</h2></div><div class="vgrid"><div class="vstat"><strong>${l?.sets?.length||0}</strong><small>${t('setsSaved')}</small></div><div class="vstat"><strong>${l?Math.max(1,Math.round((new Date(l.finished)-new Date(l.started))/60000)):0}</strong><small>${t('minute')}</small></div><div class="vstat"><strong>${l?new Set(l.sets.map(s=>s.index)).size:0}</strong><small>${t('exercises')}</small></div></div><div style="margin-top:20px">${button(t('progress'),"go('progress')",'full')}</div><div style="margin-top:10px">${button(t('returnHome'),"go('home')",'secondary full')}</div></section>`}
function nav(){if(!S.setup)return '';const tabs=[['home','⌂'],['workouts','▦'],['calendar','▣'],['progress','▥'],['profile','♙']];return tabs.map(([k,icon])=>`<button class="${(page===k||(page==='guide'&&k==='workouts'))?'active':''}" aria-label="${t(k)}" onclick="go('${k}')"><span aria-hidden="true">${icon}</span>${t(k)}</button>`).join('')}
function render(){setLang();const screens={home,workouts:programs,calendar,progress,profile,guide,session,complete};let html=S.setup?(screens[page]||home)():onboard();document.getElementById('main').innerHTML=html;document.getElementById('nav').innerHTML=nav();tickRest()}
render();setInterval(tickRest,500);
</script>
</body></html>
